<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Doorman</title>
    <script>
      (function () {
        var base = location.pathname.indexOf("/doorman-showcase") === 0 ? "/doorman-showcase" : "";
        var path = location.pathname;
        if (path.indexOf(base) === 0) path = path.slice(base.length);
        if (!path) path = "/";
        if (path.charAt(0) !== "/") path = "/" + path;
        location.replace(base + "/#" + path + location.search);
      })();
    </script>
  </head>
  <body></body>
</html>
